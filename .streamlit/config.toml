# Academic palette adapted from the Streamlit skill's minimal theme.
# Built-in fonts keep the interface independent of external font services.
[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#254D70"
backgroundColor = "#FCFAF5"
secondaryBackgroundColor = "#F0EDE5"
textColor = "#242D35"
linkColor = "#254D70"
borderColor = "#DAD6CC"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "6px"
font = "sans-serif"
headingFont = "serif"
headingFontWeights = [500, 500, 500, 500, 500, 500]
dataframeHeaderBackgroundColor = "#F0EDE5"
chartCategoricalColors = ["#254D70", "#B58937", "#557565", "#9C6262"]

[theme.sidebar]
backgroundColor = "#172D40"
secondaryBackgroundColor = "#243F56"
textColor = "#FAF8F2"
primaryColor = "#E8C46D"
borderColor = "#3E5366"
