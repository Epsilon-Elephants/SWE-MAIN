# Philosophy Classroom brand theme — navy and gold, matching the Rocky mark in
# app/assets/brand/. Built-in fonts keep the interface independent of external
# font services. Brand constants also live in app/components/brand.py; keep the
# two in sync when changing a color.
[browser]
gatherUsageStats = false

[client]
# Hide developer-only toolbar items (Deploy, rerun prompts) for presentations.
toolbarMode = "minimal"

[theme]
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 15

[theme.light]
# Brand gold marks where to click: primary buttons, selected tabs, and toggles.
# It matches the gold borders and details; primary buttons use navy text (set in
# app/components/brand.py) for AA contrast. Navy stays the brand color through the
# sidebar, links, and status badges.
primaryColor = "#EAAB00"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1D2633"
linkColor = "#00418A"
borderColor = "#E1E6EE"
dataframeHeaderBackgroundColor = "#F4F6FA"
chartCategoricalColors = ["#002664", "#EAAB00", "#4F7C6A", "#A3545A"]
# Status badges stay off the accent: tentative scores use a navy tint ("blue"),
# so gold remains a signal for actions only.
blueColor = "#002664"
blueBackgroundColor = "#E4ECF4"
blueTextColor = "#002664"

[theme.dark]
# Same brand gold; navy button text keeps AA contrast.
primaryColor = "#EAAB00"
backgroundColor = "#0C1626"
secondaryBackgroundColor = "#152238"
textColor = "#EEF2F7"
linkColor = "#8FB8F0"
borderColor = "#2A3B55"
dataframeHeaderBackgroundColor = "#152238"
chartCategoricalColors = ["#8FB8F0", "#EAAB00", "#8CC4A8", "#E0A0A4"]
blueColor = "#8FB8F0"
blueBackgroundColor = "#1F3346"
blueTextColor = "#8FB8F0"

[theme.sidebar]
backgroundColor = "#002664"
secondaryBackgroundColor = "#0E3577"
textColor = "#F3F6FB"
primaryColor = "#EAAB00"
borderColor = "#1F4588"
