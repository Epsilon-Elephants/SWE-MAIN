# Academic palette adapted from the Streamlit skill's minimal theme.
# Built-in fonts keep the interface independent of external font services.
[browser]
gatherUsageStats = false

[client]
# Hide developer-only toolbar items (Deploy, rerun prompts) for presentations.
toolbarMode = "minimal"

[theme]
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "8px"
buttonRadius = "6px"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.light]
# Warm gold accent marks where to click: primary buttons (Log in, Create assignment,
# Submit homework), selected tabs, and toggles. Deep enough that the white text
# Streamlit puts on primary buttons meets WCAG AA (4.6:1). Navy stays the brand
# color through the sidebar and links.
primaryColor = "#9E6A14"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#242D35"
linkColor = "#254D70"
borderColor = "#DFE5EB"
dataframeHeaderBackgroundColor = "#F5F7FA"
chartCategoricalColors = ["#254D70", "#B58937", "#557565", "#9C6262"]
# Status badges stay off the accent: tentative scores use a navy tint ("blue"),
# so gold remains a signal for actions only.
blueColor = "#254D70"
blueBackgroundColor = "#E4ECF4"
blueTextColor = "#254D70"

[theme.dark]
primaryColor = "#9E6A14"
backgroundColor = "#111D29"
secondaryBackgroundColor = "#1C2D3D"
textColor = "#EEF1F5"
linkColor = "#9ACAF0"
borderColor = "#415365"
dataframeHeaderBackgroundColor = "#1C2D3D"
chartCategoricalColors = ["#9ACAF0", "#E8C46D", "#97C9AE", "#DDA5A5"]
blueColor = "#9ACAF0"
blueBackgroundColor = "#1F3346"
blueTextColor = "#9ACAF0"

[theme.sidebar]
backgroundColor = "#172D40"
secondaryBackgroundColor = "#243F56"
textColor = "#FAF8F2"
primaryColor = "#E8C46D"
borderColor = "#3E5366"
